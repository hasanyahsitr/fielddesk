name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install workflow dependencies
        run: python -m pip install -r requirements.txt
      - name: Backend tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: JavaScript syntax and localization
        shell: pwsh
        run: |
          Get-ChildItem app/static/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node tests/test_i18n.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build source distribution
        run: python -X utf8 scripts/build_release.py
      - name: Verify release contents
        run: python -X utf8 scripts/verify_release.py
      - name: Keep checked source artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FieldDesk-source-${{ github.run_number }}
          path: |
            dist/FieldDesk-*-source.zip
            dist/FieldDesk-*-source.zip.sha256
          if-no-files-found: error
          retention-days: 14
